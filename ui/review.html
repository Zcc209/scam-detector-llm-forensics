<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>案例複核－詐騙帳號偵測系統</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="topbar"><a class="brand" href="/"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 1 3 5v6c0 5.6 3.8 10.7 9 12 5.2-1.3 9-6.4 9-12V5z"/><path fill="#fff" d="m10.6 15.6-3.5-3.5 1.4-1.4 2.1 2.1 4.9-4.9 1.4 1.4z"/></svg><span>詐騙帳號偵測系統</span></a><span class="workspace-label">案例複核</span></header>
<main><h1>把證據變成可追溯的案例。</h1><p>標註的是這次內容，不是整個帳號。疑似通報、品牌名稱、模型分數都不能單獨當成真實標籤。</p>
<div class="workspace"><aside class="panel"><h2>選擇案例</h2><button id="refresh" class="secondary">重新載入</button><div id="cases"></div></aside>
<section class="panel"><p id="status" role="status">請先在分析工作台完成網址或圖片分析。</p><pre id="texts"></pre>
<form id="review-form" hidden>
<label for="label">內容標籤</label><select id="label"><option>Unresolved</option><option>Normal</option><option>Fraud</option></select>
<label for="group_id">帳號／網站群組 ID（同一帳號必須相同）</label><input id="group_id" required placeholder="instagram:account_name">
<label for="pair_id">成對案例 ID（選填，同一組只放同一個 split）</label><input id="pair_id" placeholder="brand-login-01">
<label for="split">資料用途（先分組再標註，不依模型結果挑選）</label><select id="split"><option>train</option><option>validation</option><option>calibration</option><option>test</option></select>
<label for="reviewer">複核者</label><input id="reviewer" required>
<label for="label_source">判定來源（案件網址／其他可核對證據）</label><input id="label_source" required>
<label for="permission">使用依據／授權（勿公開個資）</label><input id="permission" required>
<label for="notes">確認依據與上下文（不是只填「有名品牌」）</label><textarea id="notes" rows="4" required></textarea>
<button class="primary">儲存複核，不更新模型</button></form></section></div>
</main><script src="/review.js"></script></body></html>
